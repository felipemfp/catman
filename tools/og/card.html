<!doctype html>
<!-- Source of public/og.png (1200×630). Regenerate with `npm run og:regen`. Same palette as the game. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; background: #14121c; overflow: hidden; font-family: system-ui, 'Segoe UI', sans-serif; }
      svg { position: absolute; inset: 0; }
      .title { position: absolute; left: 80px; top: 150px; font-size: 128px; font-weight: 900; letter-spacing: 4px; color: #ffd23f; }
      .tag { position: absolute; left: 86px; top: 340px; font-size: 40px; color: #f4ead5; line-height: 1.35; }
      .url { position: absolute; left: 86px; bottom: 56px; font-size: 28px; color: #8fd3ff; opacity: 0.9; }
    </style>
  </head>
  <body>
    <svg width="1200" height="630" viewBox="0 0 1200 630">
      <!-- receding lane on the right -->
      <polygon points="790,0 1110,0 1200,630 700,630" fill="#1d1a29" />
      <g fill="#14121c">
        <polygon points="795,40 1112,40 1118,90 789,90" />
        <polygon points="780,150 1124,150 1133,220 770,220" />
        <polygon points="760,300 1145,300 1158,390 746,390" />
        <polygon points="734,480 1170,480 1186,590 718,590" />
      </g>
      <!-- gate pair: buff (green) and weapon (purple) -->
      <rect x="800" y="110" width="150" height="56" rx="6" fill="#2fbf71" opacity="0.55" stroke="#fff" stroke-width="3" />
      <rect x="960" y="110" width="150" height="56" rx="6" fill="#7a5cff" opacity="0.7" stroke="#fff" stroke-width="3" />
      <text x="875" y="148" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">+30% DMG</text>
      <text x="1035" y="148" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">⚡ LASER</text>
      <!-- rats (stickmen, eyes red) -->
      <g stroke="#b9a99a" stroke-width="5" fill="none" stroke-linecap="round">
        <g transform="translate(850,250)"><circle cx="0" cy="-10" r="10"/><path d="M0 0v14M0 5l-12 7M0 5l12 7M0 14l-9 12M0 14l9 12"/></g>
        <g transform="translate(925,235)"><circle cx="0" cy="-10" r="10"/><path d="M0 0v14M0 5l-12 7M0 5l12 7M0 14l-9 12M0 14l9 12"/></g>
        <g transform="translate(1040,255)"><circle cx="0" cy="-10" r="10"/><path d="M0 0v14M0 5l-12 7M0 5l12 7M0 14l-9 12M0 14l9 12"/></g>
      </g>
      <g fill="#ff5a5a"><circle cx="847" cy="241" r="2.5"/><circle cx="853" cy="241" r="2.5"/><circle cx="922" cy="226" r="2.5"/><circle cx="928" cy="226" r="2.5"/><circle cx="1037" cy="246" r="2.5"/><circle cx="1043" cy="246" r="2.5"/></g>
      <!-- pencil shots -->
      <g fill="#ffd23f"><rect x="945" y="330" width="10" height="26" rx="2"/><rect x="945" y="410" width="10" height="26" rx="2"/></g>
      <!-- tuna -->
      <g transform="translate(1080,350)"><circle r="30" fill="#2fbf71" opacity="0.25"/><ellipse rx="26" ry="15" fill="#5b8def"/><polygon points="20,0 36,-14 36,14" fill="#5b8def"/><circle cx="-14" cy="-4" r="3" fill="#000"/></g>
      <!-- the cat, big, at the bottom of the lane -->
      <g transform="translate(950,520) scale(3.2)" stroke="#f4ead5" stroke-width="3" fill="none" stroke-linecap="round">
        <circle cx="0" cy="-14" r="9" />
        <path d="M0 -5L0 10M0 0L-10 -6M0 0L10 -6M0 10L-8 23M0 10L8 23M0 9L10 5L15 -4" />
        <path d="M-8 -19L-3 -23L-9 -28Z M8 -19L3 -23L9 -28Z" fill="#f4ead5" />
      </g>
    </svg>
    <div class="title">CATMAN</div>
    <div class="tag">Run. Shoot rats. Pick your gates.<br />Beat the boss. Share your ghost.</div>
    <div class="url">catman.felipemfp.dev</div>
  </body>
</html>
